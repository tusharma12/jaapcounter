name: japmala
description: "Naam Jap Counter – Smaran: your peaceful digital mala for daily Naam Jap."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^18.0.1

  # Persistence
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Charts
  fl_chart: ^1.2.0

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Platform integrations
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  home_widget: ^0.9.3
  wakelock_plus: ^1.8.0

  intl: ^0.20.2
  # Cupertino page transitions on iOS pull glyphs from this font.
  cupertino_icons: ^1.0.8
  meta: ^1.16.0
  uuid: ^4.6.0
  quick_actions: ^1.1.1

  # Voice input and a mantra's own recorded voice note
  speech_to_text: ^7.5.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  in_app_review: ^2.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/stories/
    - assets/branding/
    - assets/chants/loops/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
